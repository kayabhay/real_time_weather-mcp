[project]
name = "real-time-weather-mcp"
version = "0.1.0"
description = "FastMCP server providing real-time weather reports for Claude Desktop and MCP clients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abhay" }
]
dependencies = [
    "mcp[cli]>=1.3.0",
]

[project.scripts]
weather-mcp = "main:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
